; New Vision — M5StickC Plus2 firmware
; Stick is mounted on the headset (may be powered from its USB-C port):
;   Quest --BLE (UART-style service)--> stick --BLE keyboard (HID)--> laptop
; One BLE peripheral, two connections at once. Stick buttons are not used.
; USB serial accepts the same text commands (handy for tests from the laptop).
; Look and Impact FX after Vartovyi (github.com/Skerpsh/vartovyi, MIT); Tektur font (fonts/OFL.txt).

[env:m5stickc_plus2]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 1500000
; Tektur, the interface font, in the sizes Vartovyi's tools/make-fonts.py builds
board_build.embed_files =
  fonts/t11.vlw
  fonts/t14.vlw
  fonts/t18.vlw
  fonts/t24.vlw
  fonts/t32.vlw
  fonts/t44.vlw
; The Plus2's ESP32-PICO-V3-02 has 2 MB PSRAM: the screen buffer lives there, internal RAM stays for Bluetooth
build_flags = -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue
lib_deps =
    m5stack/M5Unified@^0.2.2
    h2zero/NimBLE-Arduino@^1.4.3
